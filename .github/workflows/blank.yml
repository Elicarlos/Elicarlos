name: 🐍 Ultimate Snake Animation Generator

on:
  schedule:
    - cron: "0 0 * * *"  # Diariamente às 00:00 UTC
  
  workflow_dispatch:
    inputs:
      theme:
        description: 'Tema da animação'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - matrix
          - neon
          - retro
          - ocean
          - custom
      
      force_rebuild:
        description: 'Forçar rebuild completo'
        required: false
        default: false
        type: boolean
  
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake-animation.yml'
      - 'README.md'

jobs:
  generate:
    name: 🎮 Generate Snake Animations
    permissions: 
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 Collect GitHub stats
        id: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ github.repository_owner }}"
          
          CONTRIBS=$(gh api graphql -f query='
            query($userName:String!) {
              user(login: $userName){
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                  }
                }
              }
            }' -f userName="$OWNER" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions' 2>/dev/null || echo "0")
          
          echo "total_contributions=${CONTRIBS}" >> $GITHUB_OUTPUT
          echo "generation_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "workflow_run=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "✅ Estatísticas coletadas: ${CONTRIBS} contribuições"

      - name: 🐍 Generate Matrix Theme
        if: >
          github.event.inputs.theme == 'all' ||
          github.event.inputs.theme == 'matrix' ||
          github.event.inputs.theme == '' ||
          github.event.inputs.theme == null ||
          github.event_name == 'schedule' ||
          github.event_name == 'push'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-matrix.svg?palette=github-dark&color_snake=#00ff41&color_dots=#001a00,#003d0d,#006d1a,#00a82d,#39ff14

      - name: 🌊 Generate Ocean Theme
        if: >
          github.event.inputs.theme == 'all' ||
          github.event.inputs.theme == 'ocean' ||
          github.event.inputs.theme == '' ||
          github.event.inputs.theme == null ||
          github.event_name == 'schedule' ||
          github.event_name == 'push'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-ocean.svg?palette=github-dark&color_snake=#00bfff&color_dots=#001f3f,#003d5c,#0074cc,#3dd5f3,#74f7ff

      - name: 🕹️ Generate Retro Theme
        if: >
          github.event.inputs.theme == 'all' ||
          github.event.inputs.theme == 'retro' ||
          github.event.inputs.theme == '' ||
          github.event.inputs.theme == null ||
          github.event_name == 'schedule' ||
          github.event_name == 'push'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-retro.svg?palette=github-dark&color_snake=#ff6b6b&color_dots=#2d1b69,#5a189a,#7209b7,#f72585,#4cc9f0

      - name: ⚡ Generate Neon Theme
        if: >
          github.event.inputs.theme == 'all' ||
          github.event.inputs.theme == 'neon' ||
          github.event.inputs.theme == '' ||
          github.event.inputs.theme == null ||
          github.event_name == 'schedule' ||
          github.event_name == 'push'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff0080&color_dots=#0d0221,#460c68,#9a031e,#fb8500,#ffb700

      - name: 🌈 Generate Classic Themes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?palette=github-light

      - name: 🎨 Generate Custom Theme
        if: github.event.inputs.theme == 'custom'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-custom.svg?palette=github-dark&color_snake=#9333ea&color_dots=#1e1b4b,#4c1d95,#7c3aed,#a78bfa,#c4b5fd

      - name: 🔍 Verify generated files
        run: |
          echo "📂 Generated files:"
          ls -lah dist/ || echo "⚠️ dist/ directory is empty or missing"
          for file in dist/*.svg; do
            if [ -f "$file" ]; then
              SIZE=$(wc -c < "$file")
              echo "✅ $(basename $file) - ${SIZE} bytes"
            fi
          done

      - name: 🚀 Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "🐍 Update snake animations [Run #${{ github.run_number }}] [skip ci]"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Generate summary
        if: always()
        run: |
          echo "## 🐍 Snake Animation Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated at:** ${{ steps.stats.outputs.generation_time }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Contributions:** ${{ steps.stats.outputs.total_contributions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎨 Themes Generated" >> $GITHUB_STEP_SUMMARY
          echo "- Matrix Theme 🕹️" >> $GITHUB_STEP_SUMMARY
          echo "- Ocean Theme 🌊" >> $GITHUB_STEP_SUMMARY
          echo "- Retro Theme 🕹️" >> $GITHUB_STEP_SUMMARY
          echo "- Neon Theme ⚡" >> $GITHUB_STEP_SUMMARY
          echo "- Classic Themes 🌈" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 View Results" >> $GITHUB_STEP_SUMMARY
          echo "Check the [output branch](https://github.com/${{ github.repository }}/tree/output) for all generated animations." >> $GITHUB_STEP_SUMMARY

      - name: ❌ Handle failure
        if: failure()
        run: |
          echo "::error::Failed to generate snake animations"
          echo "## ❌ Generation Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
